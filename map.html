<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>District Map Explorer</title>
  <script src="bydel_geo.js"></script>
  <script src="web_metrics.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --ink: #16232b;
      --paper: #f7f7f4;
      --panel: rgba(255, 255, 255, 0.94);
      --line: #d6d3d1;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    #app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 0.6rem;
      padding: 0.65rem 0.75rem;
      background: #f8f6f2;
      border-bottom: 1px solid var(--line);
    }

    .control {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.45rem 0.6rem;
    }

    .control label {
      display: block;
      font-size: 0.78rem;
      color: #4b5563;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .control select,
    .control input[type="range"] {
      width: 100%;
    }

    .year-value {
      margin-left: 0.45rem;
      font-weight: 700;
      color: #0f766e;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .city-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.35rem;
      font-size: 0.86rem;
    }

    .city-summary div {
      background: #fcfcfb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.38rem 0.45rem;
      line-height: 1.25;
    }

    .city-summary b {
      font-size: 0.94rem;
      color: #111827;
    }

    .legend {
      background: rgba(255, 255, 255, 0.94);
      padding: 0.55rem 0.6rem;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      box-shadow: 0 2px 10px #00000018;
      width: 220px;
    }

    .legend-title {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #4b5563;
      margin-bottom: 0.3rem;
      font-weight: 700;
    }

    .legend-ramp {
      height: 12px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      margin-bottom: 0.28rem;
    }

    .legend-scale {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #334155;
    }

    .leaflet-tooltip {
      font-size: 0.85rem;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 8px #0000001a;
    }

    @media (max-width: 800px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <div class="control">
        <label for="metric">Map Metric</label>
        <select id="metric"></select>
      </div>
      <div class="control">
        <label for="year">Year <span id="yearValue" class="year-value"></span></label>
        <input id="year" type="range" />
      </div>
      <div class="control">
        <label>City Snapshot</label>
        <div class="city-summary" id="citySummary"></div>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map", { zoomControl: true }).setView([55.68, 12.56], 11.6);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 20
    }).addTo(map);

    const metricSelect = document.getElementById("metric");
    const yearInput = document.getElementById("year");
    const yearValue = document.getElementById("yearValue");
    const citySummary = document.getElementById("citySummary");

    const state = { metric: "jutland_share_pct", year: 2024 };

    let geoData = null;
    let metricsData = null;
    let geoLayer = null;

    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function() {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = `
        <div class="legend-title" id="legendTitle">Legend</div>
        <div class="legend-ramp" id="legendRamp"></div>
        <div class="legend-scale"><span id="legendMin">0</span><span id="legendMax">0</span></div>
      `;
      return div;
    };
    legend.addTo(map);

    function formatNumber(value, decimals = 1) {
      if (value == null || Number.isNaN(value)) return "n/a";
      return Number(value).toLocaleString("en-US", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function formatByMetric(metric, value) {
      const meta = metricsData.metrics[metric];
      if (value == null) return "n/a";
      if (meta.unit === "%") return `${formatNumber(value, meta.decimals)}%`;
      return formatNumber(value, meta.decimals);
    }

    function getRampColors(metric) {
      const unit = metricsData.metrics[metric].unit;
      if (unit === "%") {
        return ["#f0fdfa", "#99f6e4", "#2dd4bf", "#0d9488", "#115e59"];
      }
      return ["#fff7ed", "#fdba74", "#fb923c", "#ea580c", "#9a3412"];
    }

    function hexToRgb(hex) {
      const n = hex.replace("#", "");
      return {
        r: parseInt(n.slice(0, 2), 16),
        g: parseInt(n.slice(2, 4), 16),
        b: parseInt(n.slice(4, 6), 16)
      };
    }

    function interpColor(c1, c2, t) {
      const a = hexToRgb(c1);
      const b = hexToRgb(c2);
      const r = Math.round(a.r + (b.r - a.r) * t);
      const g = Math.round(a.g + (b.g - a.g) * t);
      const b2 = Math.round(a.b + (b.b - a.b) * t);
      return `rgb(${r}, ${g}, ${b2})`;
    }

    function colorScale(value, min, max, metric) {
      if (value == null || Number.isNaN(value)) return "#e5e7eb";
      const colors = getRampColors(metric);
      if (max <= min) return colors[colors.length - 1];

      const unit = metricsData.metrics[metric].unit;
      let t;
      if (unit === "count") {
        const lv = Math.log10(Math.max(value, 1));
        const lmin = Math.log10(Math.max(min, 1));
        const lmax = Math.log10(Math.max(max, 1));
        t = (lv - lmin) / (lmax - lmin || 1);
      } else {
        t = (value - min) / (max - min);
      }
      t = Math.min(1, Math.max(0, t));

      const seg = (colors.length - 1) * t;
      const i = Math.floor(seg);
      const frac = seg - i;
      if (i >= colors.length - 1) return colors[colors.length - 1];
      return interpColor(colors[i], colors[i + 1], frac);
    }

    function getDistrictValue(districtName, metric, year) {
      const y = metricsData.district_year[String(year)] || {};
      const row = y[districtName];
      return row ? row[metric] : null;
    }

    function getStatsForYear(metric, year) {
      const y = metricsData.district_year[String(year)] || {};
      const values = Object.values(y).map((d) => d[metric]).filter((v) => v != null && !Number.isNaN(v));
      if (!values.length) return { min: 0, max: 0 };
      return { min: Math.min(...values), max: Math.max(...values) };
    }

    function tooltipHtml(districtName, year) {
      const y = metricsData.district_year[String(year)] || {};
      const row = y[districtName] || {};
      return `
        <div style="min-width:180px">
          <strong>${districtName}</strong><br>
          Year: <b>${year}</b><br>
          Jutland-born share: <b>${formatByMetric("jutland_share_pct", row.jutland_share_pct)}</b><br>
          København-born share: <b>${formatByMetric("local_share_pct", row.local_share_pct)}</b><br>
          High-education share: <b>${formatByMetric("high_ed_share_pct", row.high_ed_share_pct)}</b><br>
          Jutland-born residents: <b>${formatByMetric("jutland_residents", row.jutland_residents)}</b>
        </div>
      `;
    }

    function updateCitySummary(year) {
      const city = metricsData.city_year[String(year)];
      if (!city) {
        citySummary.innerHTML = "No city data for this year";
        return;
      }
      citySummary.innerHTML = `
        <div>Jutland-born share<br><b>${formatByMetric("jutland_share_pct", city.jutland_share_pct)}</b></div>
        <div>København-born share<br><b>${formatByMetric("local_share_pct", city.local_share_pct)}</b></div>
        <div>Jutland-born residents<br><b>${formatByMetric("jutland_residents", city.jutland_residents)}</b></div>
        <div>Total residents<br><b>${formatByMetric("total_residents", city.total_residents)}</b></div>
      `;
    }

    function updateLegend(metric, min, max) {
      const title = document.getElementById("legendTitle");
      const ramp = document.getElementById("legendRamp");
      const minEl = document.getElementById("legendMin");
      const maxEl = document.getElementById("legendMax");
      const meta = metricsData.metrics[metric];

      title.textContent = meta.label;
      const colors = getRampColors(metric);
      ramp.style.background = `linear-gradient(90deg, ${colors.join(",")})`;
      minEl.textContent = formatByMetric(metric, min);
      maxEl.textContent = formatByMetric(metric, max);
    }

    function updateMap() {
      const metric = state.metric;
      const year = state.year;
      yearValue.textContent = year;

      const { min, max } = getStatsForYear(metric, year);
      updateLegend(metric, min, max);
      updateCitySummary(year);

      geoLayer.eachLayer((layer) => {
        const district = layer.feature.properties.navn;
        const value = getDistrictValue(district, metric, year);
        layer.setStyle({
          fillColor: colorScale(value, min, max, metric),
          fillOpacity: 0.82,
          color: "#0f172a",
          weight: 1
        });
        layer.bindTooltip(tooltipHtml(district, year), { sticky: true });
      });
    }

    function setupControls() {
      Object.entries(metricsData.metrics).forEach(([key, meta]) => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = meta.label;
        metricSelect.appendChild(opt);
      });
      metricSelect.value = state.metric;

      yearInput.min = metricsData.years[0];
      yearInput.max = metricsData.years[metricsData.years.length - 1];
      yearInput.step = 1;
      state.year = metricsData.latest_year;
      yearInput.value = state.year;

      metricSelect.addEventListener("change", (e) => {
        state.metric = e.target.value;
        updateMap();
      });
      yearInput.addEventListener("input", (e) => {
        state.year = Number(e.target.value);
        updateMap();
      });
    }

    function initMap(geo, web) {
      geoData = geo;
      metricsData = web;

      geoLayer = L.geoJSON(geoData, {
        style: {
          color: "#0f172a",
          weight: 1,
          fillOpacity: 0.82
        }
      }).addTo(map);

      setupControls();
      updateMap();
    }

    if (window.BYDEL_GEOJSON && window.WEB_METRICS) {
      initMap(window.BYDEL_GEOJSON, window.WEB_METRICS);
    } else {
      Promise.all([
        fetch("bydel.csv").then((r) => r.text()).then((t) => JSON.parse(t)),
        fetch("web_metrics.json").then((r) => r.json())
      ])
        .then(([geo, web]) => initMap(geo, web))
        .catch((err) => {
          console.error(err);
          alert("Failed to load map data. Ensure bydel_geo.js/web_metrics.js (or JSON files) are available in project root.");
        });
    }
  </script>
</body>
</html>
