<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jutlanders Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: 'Space Grotesk', system-ui, sans-serif; background: #f8f7f4; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #controls {
      display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .ctrl-group { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
    .ctrl-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; }
    .ctrl-group select { font-size: 13px; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; color: #111827; cursor: pointer; }
    #year-group { flex: 1; min-width: 200px; max-width: 480px; }
    #year-group .slider-row { display: flex; align-items: center; gap: 10px; }
    #year-group input[type=range] { flex: 1; accent-color: #d97706; cursor: pointer; }
    #year-label { font-size: 15px; font-weight: 700; color: #1e3a5f; min-width: 42px; }
    #map { flex: 1; min-height: 0; }
    .legend { background: rgba(255,255,255,0.92); padding: 8px 12px; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.15); font-size: 12px; line-height: 1.6; min-width: 130px; }
    .legend h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin-bottom: 6px; }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-swatch { width: 16px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  </style>
</head>
<body>
<div id="app">
  <div id="controls">
    <div class="ctrl-group" id="year-group">
      <label>Year</label>
      <div class="slider-row">
        <input type="range" id="year-slider" min="1977" max="2026" value="2025" step="1" />
        <span id="year-label">2025</span>
      </div>
    </div>
    <div class="ctrl-group">
      <label>Sex</label>
      <select id="sex-select">
        <option value="All">All</option>
        <option value="Kvinder">Women</option>
        <option value="Mænd">Men</option>
      </select>
    </div>
    <div class="ctrl-group" style="min-width:180px">
      <label>Jylland Region</label>
      <select id="region-select">
        <option value="All">All Jylland</option>
        <option value="Nordjylland">Nordjylland</option>
        <option value="Sydjylland">Sydjylland</option>
        <option value="Vestjylland">Vestjylland</option>
        <option value="Østjylland">Østjylland</option>
      </select>
    </div>
  </div>
  <div id="map"></div>
</div>
<script>
const leafletMap = L.map('map', { center: [55.68, 12.56], zoom: 11 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(leafletMap);

const COLOR_STEPS = ['#ffffb2','#fecc5c','#fd8d3c','#f03b20','#bd0026','#800026','#4d0015'];

function getColor(value, maxVal) {
  if (!value || maxVal === 0) return '#e5e7eb';
  const idx = Math.min(Math.floor((value / maxVal) * (COLOR_STEPS.length - 1)), COLOR_STEPS.length - 1);
  return COLOR_STEPS[idx];
}

let appData = null, geojsonLayer = null, labelLayer = null, legendControl = null;
let currentYear = '2025', currentSex = 'All', currentRegion = 'All';

function ringCentroid(ring) {
  let twoArea = 0, cx = 0, cy = 0;
  for (let i = 0; i < ring.length - 1; i++) {
    const [x1,y1] = ring[i], [x2,y2] = ring[i+1];
    const cross = x1*y2 - x2*y1;
    twoArea += cross; cx += (x1+x2)*cross; cy += (y1+y2)*cross;
  }
  if (twoArea === 0) return [ring.reduce((s,p)=>s+p[0],0)/ring.length, ring.reduce((s,p)=>s+p[1],0)/ring.length];
  return [cx/(3*twoArea), cy/(3*twoArea)];
}

function featureCentroid(feat) {
  const g = feat.geometry;
  let rings = g.type==='Polygon' ? [g.coordinates[0]] : g.type==='MultiPolygon' ? g.coordinates.map(p=>p[0]) : [];
  if (!rings.length) return null;
  const best = rings.reduce((a,b) => {
    const area = r => { const xs=r.map(p=>p[0]),ys=r.map(p=>p[1]); return (Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys)); };
    return area(b)>area(a)?b:a;
  });
  return ringCentroid(best);
}

function render() {
  if (!appData) return;
  const yearData = (appData.data[currentRegion] || {})[currentSex] || {};
  const yearRows = yearData[currentYear] || {};
  const values = Object.values(yearRows).filter(v => v > 0);
  const maxVal = values.length ? Math.max.apply(null, values) : 1;

  if (geojsonLayer) { leafletMap.removeLayer(geojsonLayer); geojsonLayer = null; }
  if (labelLayer)   { leafletMap.removeLayer(labelLayer);   labelLayer = null; }

  geojsonLayer = L.geoJSON(appData.geo, {
    style: function(feat) {
      var name = (feat.properties && feat.properties.navn) ? feat.properties.navn : '';
      var value = yearRows[name] || 0;
      return { fillColor: getColor(value, maxVal), fillOpacity: 0.8, color: '#374151', weight: 1.2, opacity: 0.6 };
    },
    onEachFeature: function(feat, layer) {
      var name = (feat.properties && feat.properties.navn) ? feat.properties.navn : 'Unknown';
      var value = yearRows[name] || 0;
      layer.bindTooltip('<strong>' + name + '</strong><br>' + value.toLocaleString() + ' Jutlanders', { sticky: true });
    },
  }).addTo(leafletMap);

  labelLayer = L.layerGroup();
  appData.geo.features.forEach(function(feat) {
    var name = feat.properties && feat.properties.navn;
    if (!name) return;
    var c = featureCentroid(feat);
    if (!c) return;
    L.marker([c[1], c[0]], {
      icon: L.divIcon({
        html: '<div style="font-size:9px;font-weight:700;color:#1e3a5f;white-space:nowrap;text-shadow:1px 1px 2px #fff,-1px -1px 2px #fff;">' + name + '</div>',
        iconSize: [120,20], iconAnchor: [60,10], className: '',
      }),
    }).addTo(labelLayer);
  });
  labelLayer.addTo(leafletMap);

  if (legendControl) { leafletMap.removeControl(legendControl); legendControl = null; }
  legendControl = L.control({ position: 'bottomright' });
  legendControl.onAdd = function() {
    var div = L.DomUtil.create('div','legend');
    var steps = COLOR_STEPS.length - 1;
    var html = '<h4>Jutlanders (' + currentYear + ')</h4>';
    for (var i = steps; i >= 0; i--) {
      var val = Math.round((i/steps)*maxVal);
      html += '<div class="legend-item"><div class="legend-swatch" style="background:' + COLOR_STEPS[i] + '"></div><span>' + val.toLocaleString() + '</span></div>';
    }
    div.innerHTML = html;
    return div;
  };
  legendControl.addTo(leafletMap);
}

document.getElementById('year-slider').addEventListener('input', function(e) {
  currentYear = e.target.value;
  document.getElementById('year-label').textContent = currentYear;
  render();
});
document.getElementById('sex-select').addEventListener('change', function(e) { currentSex = e.target.value; render(); });
document.getElementById('region-select').addEventListener('change', function(e) { currentRegion = e.target.value; render(); });

fetch('data/map_data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    appData = data;
    var years = data.years;
    var slider = document.getElementById('year-slider');
    slider.min = Math.min.apply(null, years);
    slider.max = Math.max.apply(null, years);
    var defaultYear = years[years.length - 2] !== undefined ? years[years.length - 2] : Math.max.apply(null, years);
    slider.value = defaultYear;
    currentYear = String(defaultYear);
    document.getElementById('year-label').textContent = currentYear;
    render();
  })
  .catch(function(err) {
    console.error('Failed to load map data:', err);
    document.getElementById('map').innerHTML = '<p style="padding:2rem;color:#dc2626">Could not load map data. Make sure you access the page via http://localhost:8000 (not file://).</p>';
  });
</script>
</body>
</html>
