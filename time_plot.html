<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trends Explorer</title>
  <script src="web_metrics.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --paper: #f8f7f4;
      --ink: #18252e;
      --panel: #ffffff;
      --line: #ddd6ce;
    }

    html, body {
      margin: 0;
      background: var(--paper);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--ink);
    }

    .app {
      display: grid;
      gap: 0.75rem;
      padding: 0.75rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
    }

    .card label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #4b5563;
      margin-bottom: 0.3rem;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 0.35rem;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font: inherit;
    }

    .district-grid {
      margin-top: 0.2rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.25rem 0.5rem;
      max-height: 190px;
      overflow: auto;
      padding-right: 0.2rem;
    }

    .district-grid label {
      display: flex;
      align-items: center;
      gap: 0.42rem;
      font-size: 0.89rem;
      color: #334155;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      margin: 0;
    }

    .district-grid input[type="checkbox"] {
      transform: translateY(1px);
    }

    #trendChart,
    #cityChart,
    #rankChart {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 350px;
    }

    #cityChart,
    #rankChart {
      min-height: 320px;
    }

    .meta {
      font-size: 0.9rem;
      color: #475569;
      line-height: 1.35;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }
      .district-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="controls">
      <div class="card">
        <label for="metric">District Trend Metric</label>
        <select id="metric"></select>
        <p class="meta" id="metricHint"></p>
      </div>
      <div class="card">
        <label>Districts to Compare</label>
        <div class="district-grid" id="districts"></div>
      </div>
    </div>

    <div id="trendChart"></div>
    <div id="cityChart"></div>
    <div id="rankChart"></div>
  </div>

  <script>
    const metricSelect = document.getElementById("metric");
    const metricHint = document.getElementById("metricHint");
    const districtsEl = document.getElementById("districts");

    const state = {
      metric: "jutland_residents",
      selectedDistricts: new Set(),
    };

    let data = null;

    function fmt(value, metricKey) {
      if (value == null || Number.isNaN(value)) return "n/a";
      const meta = data.metrics[metricKey];
      if (meta.unit === "%") {
        return `${Number(value).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`;
      }
      return Number(value).toLocaleString("en-US", { maximumFractionDigits: 0 });
    }

    function metricValuesForDistrict(district, metricKey) {
      return data.years.map((y) => {
        const row = data.district_year[String(y)]?.[district];
        return row ? row[metricKey] : null;
      });
    }

    function meanHighEdSeries() {
      return data.years.map((y) => {
        const rows = Object.values(data.district_year[String(y)] || {});
        const vals = rows.map((r) => r.high_ed_share_pct).filter((v) => v != null && !Number.isNaN(v));
        if (!vals.length) return null;
        return vals.reduce((a, b) => a + b, 0) / vals.length;
      });
    }

    function checkedDistricts() {
      return [...districtsEl.querySelectorAll("input[type=checkbox]:checked")].map((el) => el.value);
    }

    function renderTrendChart() {
      const districts = checkedDistricts();
      const metricKey = state.metric;
      const meta = data.metrics[metricKey];

      const traces = districts.map((district) => ({
        x: data.years,
        y: metricValuesForDistrict(district, metricKey),
        mode: "lines",
        name: district,
        line: { width: 2.4 },
        hovertemplate: `<b>${district}</b><br>Year=%{x}<br>${meta.label}=%{y:.2f}${meta.unit === "%" ? "%" : ""}<extra></extra>`
      }));

      Plotly.newPlot("trendChart", traces, {
        title: `${meta.label} by District Over Time`,
        xaxis: { title: "Year", tickmode: "linear", dtick: 5 },
        yaxis: { title: meta.unit === "%" ? "Share (%)" : "Residents" },
        paper_bgcolor: "#ffffff",
        plot_bgcolor: "#ffffff",
        hovermode: "x unified",
        legend: { orientation: "h", y: -0.2 }
      }, { responsive: true, displayModeBar: false });

      metricHint.textContent = meta.unit === "%"
        ? "Share metrics are percentages of district population."
        : "Count metrics are absolute residents in each district.";
    }

    function renderCityChart() {
      const cityRows = data.years.map((y) => data.city_year[String(y)] || null);
      const jut = cityRows.map((r) => r ? r.jutland_share_pct : null);
      const loc = cityRows.map((r) => r ? r.local_share_pct : null);
      const hed = meanHighEdSeries();

      Plotly.newPlot("cityChart", [
        { x: data.years, y: jut, mode: "lines", name: "Jutland share (citywide)", line: { width: 2.7, color: "#0f766e" } },
        { x: data.years, y: loc, mode: "lines", name: "København-born share (citywide)", line: { width: 2.7, color: "#b91c1c" } },
        { x: data.years, y: hed, mode: "lines", name: "Mean district high-education share", line: { width: 2.2, color: "#1d4ed8", dash: "dot" } },
      ], {
        title: "Citywide Shares and District Education Context",
        xaxis: { title: "Year", tickmode: "linear", dtick: 5 },
        yaxis: { title: "Share (%)" },
        paper_bgcolor: "#ffffff",
        plot_bgcolor: "#ffffff",
        hovermode: "x unified",
        legend: { orientation: "h", y: -0.2 }
      }, { responsive: true, displayModeBar: false });
    }

    function renderRankChart() {
      const metricKey = state.metric;
      const latestYear = data.latest_year;
      const rows = Object.entries(data.district_year[String(latestYear)] || {})
        .map(([district, values]) => ({ district, value: values[metricKey] }))
        .filter((d) => d.value != null && !Number.isNaN(d.value))
        .sort((a, b) => a.value - b.value);

      Plotly.newPlot("rankChart", [{
        type: "bar",
        x: rows.map((r) => r.value),
        y: rows.map((r) => r.district),
        orientation: "h",
        marker: { color: "#0284c7" },
        text: rows.map((r) => fmt(r.value, metricKey)),
        textposition: "outside",
        cliponaxis: false,
        hovertemplate: "%{y}<br>%{x:.2f}<extra></extra>"
      }], {
        title: `${data.metrics[metricKey].label} Ranking (${latestYear})`,
        xaxis: { title: data.metrics[metricKey].unit === "%" ? "Share (%)" : "Residents" },
        yaxis: { automargin: true },
        paper_bgcolor: "#ffffff",
        plot_bgcolor: "#ffffff",
        margin: { l: 150, r: 40, t: 70, b: 50 }
      }, { responsive: true, displayModeBar: false });
    }

    function renderDistrictSelectors() {
      const top = (data.highlights?.top_jutland_latest || []).map((d) => d.district);
      const defaults = new Set([...top, "Amager Vest"].filter((d) => data.districts.includes(d)).slice(0, 5));
      state.selectedDistricts = defaults;

      districtsEl.innerHTML = "";
      data.districts.forEach((district) => {
        const id = `d-${district.replace(/[^a-zA-Z0-9]/g, "_")}`;
        const wrap = document.createElement("label");
        wrap.setAttribute("for", id);
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = id;
        cb.value = district;
        cb.checked = defaults.has(district);
        cb.addEventListener("change", () => {
          const checked = checkedDistricts();
          if (!checked.length) {
            cb.checked = true;
            return;
          }
          renderTrendChart();
        });
        const txt = document.createTextNode(district);
        wrap.appendChild(cb);
        wrap.appendChild(txt);
        districtsEl.appendChild(wrap);
      });
    }

    function setupMetrics() {
      const allowed = ["jutland_residents", "jutland_share_pct", "local_share_pct", "high_ed_share_pct"];
      allowed.forEach((key) => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = data.metrics[key].label;
        metricSelect.appendChild(opt);
      });
      metricSelect.value = state.metric;
      metricSelect.addEventListener("change", (e) => {
        state.metric = e.target.value;
        renderTrendChart();
        renderRankChart();
      });
    }

    function initFromData(json) {
        data = json;
        setupMetrics();
        renderDistrictSelectors();
        renderTrendChart();
        renderCityChart();
        renderRankChart();
    }

    if (window.WEB_METRICS) {
      initFromData(window.WEB_METRICS);
    } else {
      fetch("web_metrics.json")
        .then((r) => r.json())
        .then(initFromData)
        .catch((err) => {
          console.error(err);
          alert("Failed to load trend data. Ensure web_metrics.json (or web_metrics.js) is available in project root.");
        });
    }
  </script>
</body>
</html>
