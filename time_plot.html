<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jutland Residents Over Time</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #chart {
      width: 100%;
      height: 100%;
    }
    .error {
      margin: 0;
      padding: 1rem;
      color: #b42318;
      line-height: 1.4;
      font-size: 0.95rem;
    }
  </style>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="data/map_data.js"></script>
</head>
<body>
  <div id="chart" role="img" aria-label="Number of Jutlanders by Copenhagen area over time"></div>

  <script>
    const chartEl = document.getElementById("chart");

    function makeTraces(data) {
      const allAll = data && data.data && data.data.All && data.data.All.All;
      if (!allAll) return [];

      const years = data.years.map(String);
      const districtNames = data.neighborhoods ? data.neighborhoods.slice() : Object.keys(allAll[years[0]] || {});

      return districtNames.map((district) => {
        const y = years.map((year) => {
          const row = allAll[year] || {};
          return row[district] || 0;
        });

        return {
          type: "scatter",
          mode: "lines",
          name: district,
          x: years.map((year) => Number(year)),
          y,
          hovertemplate:
            "Neighborhood=" + district +
            "<br>Year=%{x}<br>Number of residents born in Jylland=%{y:,}<extra></extra>",
        };
      });
    }

    function render(data) {
      const traces = makeTraces(data);
      if (!traces.length) {
        chartEl.innerHTML = '<p class="error">Could not render time plot: map data format was not recognized.</p>';
        return;
      }

      Plotly.newPlot(
        chartEl,
        traces,
        {
          title: { text: "Number of Jutlanders by Copenhagen Area over Time" },
          xaxis: { title: { text: "Year" }, dtick: 5 },
          yaxis: { title: { text: "Number of residents born in Jylland" }, separatethousands: true },
          legend: { title: { text: "Neighborhood" }, font: { size: 10 } },
          hovermode: "x unified",
          margin: { l: 62, r: 20, t: 56, b: 52 },
          paper_bgcolor: "#ffffff",
          plot_bgcolor: "#f7f8fb",
          autosize: true,
        },
        {
          responsive: true,
          displaylogo: false,
        }
      );
    }

    function fetchJsonWithFallback(urls, idx) {
      if (idx >= urls.length) {
        return Promise.reject(new Error("All data URLs failed."));
      }
      return fetch(urls[idx], { cache: "no-store" })
        .then((res) => {
          if (!res.ok) {
            throw new Error("HTTP " + res.status + " at " + urls[idx]);
          }
          return res.json();
        })
        .catch(() => fetchJsonWithFallback(urls, idx + 1));
    }

    const jsonCandidates = [
      "data/map_data.json",
      "./data/map_data.json",
      "../data/map_data.json",
      new URL("data/map_data.json", window.location.href).toString(),
    ].filter((u, i, arr) => arr.indexOf(u) === i);

    if (window.MAP_DATA && window.MAP_DATA.data) {
      render(window.MAP_DATA);
    } else {
      fetchJsonWithFallback(jsonCandidates, 0)
        .then(render)
        .catch(() => {
          const fileHint = window.location.protocol === "file:"
            ? "If opening via file://, run a local server (e.g. python3 -m http.server)."
            : "Check that data/map_data.json is reachable.";
          chartEl.innerHTML = '<p class="error">Could not load data for the time plot. ' + fileHint + "</p>";
        });
    }

    window.addEventListener("resize", () => {
      if (window.Plotly && chartEl) {
        Plotly.Plots.resize(chartEl);
      }
    });
  </script>
</body>
</html>
